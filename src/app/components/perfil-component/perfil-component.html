<section class="mx-auto max-w-2xl space-y-6">
  <div>
    <p class="text-sm font-semibold uppercase tracking-widest text-indigo-600">Cuenta</p>
    <h1 class="text-3xl font-bold tracking-tight text-slate-900">Mi perfil</h1>
  </div>

  @if (perfil !=null) {
    <article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <p class="text-sm text-slate-500">Nombre</p>
      <p class="mt-1 text-lg font-semibold text-slate-900">{{ perfil.nombre }}</p>
      <p class="mt-4 text-sm text-slate-500">Email</p>
      <p class="mt-1 text-lg font-semibold text-slate-900">{{ perfil.email }}</p>
      <p class="mt-4 text-sm text-slate-500">Contraseña</p>
      <p class="mt-1 text-lg font-semibold text-slate-900">{{ perfil.pass }}</p>
    </article>
  } @else if (error) {
    <p class="text-rose-600">No se ha podido cargar el perfil.</p>
  } @else {
    <p class="text-slate-600">Cargando perfil...</p>
  }
</section>
