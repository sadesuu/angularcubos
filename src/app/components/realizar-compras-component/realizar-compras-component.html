<section class="mx-auto max-w-2xl space-y-6">
  <div>
    <p class="text-sm font-semibold uppercase tracking-widest text-indigo-600">Tienda</p>
    <h1 class="text-3xl font-bold tracking-tight text-slate-900">Realizar compra</h1>
    <p class="mt-2 text-slate-600">Selecciona el cubo que quieres comprar.</p>
  </div>

  <form class="space-y-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm" (ngSubmit)="realizarCompra()">
    <div class="space-y-2">
      <label for="cubo" class="block text-sm font-medium text-slate-700">Cubo</label>
      <select id="cubo" name="cubo" required [(ngModel)]="cuboSeleccionado"
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
        @if(cubos != null){
        <option [ngValue]="undefined" disabled>Selecciona un cubo</option>
        @for (cubo of cubos; track cubo.idCubo) {
        <option [ngValue]="cubo">
          {{ cubo.nombre }} · {{ cubo.marca }} · {{ cubo.precio | currency: 'EUR' }}
        </option>
        }
        }
      </select>

    </div>

    @if (cuboSeleccionado) {
    <div class="rounded-xl bg-slate-50 p-4">
      <p class="text-sm text-slate-500">Has seleccionado</p>
      <p class="mt-1 font-semibold text-slate-900">{{ cuboSeleccionado.nombre }}</p>
      <p class="text-sm text-slate-600">{{ cuboSeleccionado.precio | currency: 'EUR' }}</p>
    </div>
    }

    <button type="submit" [disabled]="!cuboSeleccionado"
      class="w-full rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
      Comprar cubo
    </button>
  </form>
</section>
