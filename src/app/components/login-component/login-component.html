<section class="mx-auto max-w-md">
  <form
    class="space-y-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
    (ngSubmit)="logInAsync()"
  >
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Iniciar sesión</h1>
      <p class="mt-1 text-sm text-slate-600">Accede a tu cuenta.</p>
    </div>

    <div class="space-y-2">
      <label for="cajauser" class="block text-sm font-medium text-slate-700">
        Usuario
      </label>
      <input
        #cajauser
        id="cajauser"
        name="user"
        type="text"
        required
        autocomplete="username"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
      />
    </div>

    <div class="space-y-2">
      <label for="cajapassword" class="block text-sm font-medium text-slate-700">
        Contraseña
      </label>
      <input
        #cajapassword
        id="cajapassword"
        name="password"
        type="password"
        required
        autocomplete="current-password"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
      />
    </div>

    <button
      type="submit"
      class="w-full rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
    >
      Iniciar sesión
    </button>
    <a
      routerLink="/register"
      class="block text-center text-sm font-medium text-indigo-600 transition hover:text-indigo-800 hover:underline focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
    >
      ¿No tienes cuenta? Regístrate
    </a>
  </form>
</section>
